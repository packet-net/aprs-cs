name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet format Packet.Aprs.slnx --verify-no-changes
      - run: dotnet build Packet.Aprs.slnx -c Release
      - run: dotnet test Packet.Aprs.slnx -c Release --no-build
