name: package upgrades

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: package-upgrades
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upgrade:
    name: upgrade packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: full upgrade, build and test
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump-packages.py Packet.Aprs.slnx | tee "$RUNNER_TEMP/upgrades.txt"
          dotnet format Packet.Aprs.slnx --verify-no-changes
          dotnet build Packet.Aprs.slnx -c Release
          dotnet test Packet.Aprs.slnx -c Release --no-build

      - name: security fallback, build and test
        id: security
        if: steps.full.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fdx -e .dotnet
          python3 scripts/bump-packages.py Packet.Aprs.slnx --vulnerable-only | tee "$RUNNER_TEMP/upgrades.txt"
          dotnet format Packet.Aprs.slnx --verify-no-changes
          dotnet build Packet.Aprs.slnx -c Release
          dotnet test Packet.Aprs.slnx -c Release --no-build

      - name: commit and push
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then
            echo "nothing to upgrade"
            exit 0
          fi
          if [ "${{ steps.full.outcome }}" = "failure" ]; then
            subject="chore(deps): security package fixes"
          else
            subject="chore(deps): package upgrades"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "$subject"
            echo
            echo "Built and tested before commit. Changed by scripts/bump-packages.py:"
            echo
            cat "$RUNNER_TEMP/upgrades.txt"
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          git pull -q --rebase origin main
          git push origin HEAD:main
